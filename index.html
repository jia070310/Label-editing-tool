<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>柠檬标签工具</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(ellipse at 50% 18%, rgba(255, 122, 26, 0.18), transparent 52%),
          linear-gradient(165deg, #222833 0%, #151922 100%);
        color: #f4f6f8;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        transition: opacity 0.28s ease, visibility 0.28s ease;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(145deg, #ff9a4a, #ff7a1a 55%, #ef6c0c);
        box-shadow: 0 12px 32px rgba(255, 122, 26, 0.32);
        display: grid;
        place-items: center;
      }
      #boot-splash .mark svg {
        width: 30px;
        height: 30px;
      }
      #boot-splash h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      #boot-splash p {
        margin: 0;
        font-size: 13px;
        color: rgba(244, 246, 248, 0.62);
      }
      #boot-splash .bar {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        margin-top: 4px;
      }
      #boot-splash .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #ff7a1a, transparent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="正在启动">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 7h10v10H7z" />
          <path d="M3 7h4" />
          <path d="M17 7h4" />
          <path d="M7 3v4" />
          <path d="M7 17v4" />
        </svg>
      </div>
      <h1>柠檬标签工具</h1>
      <p id="boot-splash-text">正在加载…</p>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
